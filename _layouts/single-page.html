<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <nav class="nav" id="navbar" aria-label="Primary navigation">
    <div class="nav-inner">
      <div class="nav-brand">
        <a href="#about" class="nav-name" aria-label="{{ site.author.name }} home">{{ site.author.name }}</a>
        <span class="terminal-cursor" aria-hidden="true"></span>
      </div>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-controls="nav-links" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#about"><span aria-hidden="true">./</span>about</a></li>
        <li><a href="#news"><span aria-hidden="true">./</span>news</a></li>
        <li><a href="#publications"><span aria-hidden="true">./</span>pubs</a></li>
        <li><a href="#awards"><span aria-hidden="true">./</span>awards</a></li>
        <li><a href="#services"><span aria-hidden="true">./</span>services</a></li>
        <li><a href="#tools"><span aria-hidden="true">./</span>tools</a></li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-copy">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
        <p>Hosted on GitHub Pages</p>
      </div>
      {% assign visitor_tracker = site.data.visitor_tracking.current %}
      <a href="{{ visitor_tracker.dashboard_url }}" target="_blank" rel="noopener" class="visitor-link">
        Visitor map
        <img src="{{ visitor_tracker.map_url | escape }}" class="visitor-tracker" alt="" aria-hidden="true">
      </a>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-links');
    const navLinks = document.querySelectorAll('.nav-links a');
    const sections = document.querySelectorAll('section[id]');

    const setMenuOpen = open => {
      navMenu.classList.toggle('active', open);
      navToggle.classList.toggle('active', open);
      navToggle.setAttribute('aria-expanded', String(open));
      navToggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    };

    navToggle.addEventListener('click', () => {
      setMenuOpen(navToggle.getAttribute('aria-expanded') !== 'true');
    });

    navLinks.forEach(link => {
      link.addEventListener('click', () => setMenuOpen(false));
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setMenuOpen(false);
    });

    const sectionObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;

        navLinks.forEach(link => {
          const isCurrent = link.getAttribute('href') === `#${entry.target.id}`;
          link.classList.toggle('active', isCurrent);
          if (isCurrent) {
            link.setAttribute('aria-current', 'location');
          } else {
            link.removeAttribute('aria-current');
          }
        });
      });
    }, { rootMargin: '-20% 0px -70% 0px' });

    sections.forEach(section => sectionObserver.observe(section));

    const newsToggle = document.getElementById('news-toggle');
    if (newsToggle) {
      newsToggle.addEventListener('click', () => {
        const hidden = document.querySelectorAll('.news-item.hidden');
        const isExpanded = newsToggle.dataset.expanded === 'true';
        if (isExpanded) {
          document.querySelectorAll('.news-item').forEach((item, i) => {
            if (i >= 5) item.classList.add('hidden');
          });
          newsToggle.textContent = 'Show all news';
          newsToggle.dataset.expanded = 'false';
          newsToggle.setAttribute('aria-expanded', 'false');
        } else {
          hidden.forEach(item => item.classList.remove('hidden'));
          newsToggle.textContent = 'Show less';
          newsToggle.dataset.expanded = 'true';
          newsToggle.setAttribute('aria-expanded', 'true');
        }
      });
    }
  </script>
</body>
</html>
